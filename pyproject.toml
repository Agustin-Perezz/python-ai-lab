[project]
name = "python-ai-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Agustin-Perezz", email = "agustinnicolas806@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.36.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
python-ai-lab = "python_ai_lab:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
